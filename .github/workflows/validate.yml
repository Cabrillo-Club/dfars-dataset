name: Dataset Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: JSON Schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Validate dataset against schema
        run: npm run validate

      - name: Confirm per-clause files match aggregate
        run: npm run check-consistency

      - name: Lint JSON formatting
        run: npm run lint
